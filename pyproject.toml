[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agent-router"
version = "0.1.0"
description = "A small FastAPI agent router powered by local OpenJev."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "typesafe-sdk==0.7.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: performs real inference on the local OpenJev server (opt-in)"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", "models", ".openjev-venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
